# Sections for GitHub's generated release notes, chosen by pull request label.
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: ✨ Nieuw en beter / New and improved
      labels: [enhancement]
    - title: 🐛 Opgelost / Fixed
      labels: [bug]
    - title: 🔧 Overig / Other changes
      labels: ['*']
