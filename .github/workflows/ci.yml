name: CI

on:
  pull_request:
    branches: [develop, master]

# A newer push to the same pull request makes the running check pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, format
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, MinVer needs them for the version

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build (Release)
        run: dotnet build OledProtect.sln --configuration Release

      - name: Unit tests
        run: dotnet test OledProtect.sln --configuration Release --no-build

      - name: Formatting matches .editorconfig
        run: dotnet format OledProtect.sln --verify-no-changes --no-restore
