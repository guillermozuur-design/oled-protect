name: CI

# Every pull request into develop or master must build, pass the tests and be formatted.
on:
  pull_request:
    branches: [develop, master]

# Only the latest push of a pull request is worth checking.
concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  SOLUTION: OledProtect.sln

jobs:
  verify:
    name: Build, test, format
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version comes from the latest v* tag (MinVer)

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Compile
        run: dotnet build $env:SOLUTION -c Release

      - name: Tests
        run: dotnet test $env:SOLUTION -c Release --no-build

      - name: Code style
        run: dotnet format $env:SOLUTION --verify-no-changes --no-restore
