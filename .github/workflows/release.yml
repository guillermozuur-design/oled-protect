name: Release

# Two ways in:
#   * push a tag vX.Y.Z that sits on master  -> build, then a draft release waits for review on GitHub;
#   * start the workflow by hand              -> trial build, kept as a workflow artifact only.
on:
  workflow_dispatch: # no inputs: a manual run is always a trial
  push:
    tags:
      - 'v*'

jobs:
  ship:
    name: Build and draft
    runs-on: windows-latest
    permissions:
      contents: write # gh release create
    defaults:
      run:
        shell: pwsh
    env:
      FROM_TAG: ${{ github.ref_type == 'tag' }}
      TRIAL: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer walks back to the nearest v* tag

      - name: Refuse tags outside master
        if: env.FROM_TAG == 'true'
        run: |
          git fetch --quiet --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          $branches = @(git branch --remotes --contains $env:GITHUB_SHA --format='%(refname:short)')
          Write-Host "Remote branches holding $($env:GITHUB_SHA.Substring(0, 7)): $($branches -join ', ')"
          if ('origin/master' -notin $branches) {
            Write-Host "::error title=Tag not on master::$env:GITHUB_REF_NAME points at a commit master does not contain. Merge into master first, then tag there."
            exit 1
          }

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Give the trial build its own version
        if: env.TRIAL == 'true'
        run: |
          # The marker goes in the pre-release part, because MinVer leaves +build metadata out of the
          # Version that build.ps1 reads (and so out of the file names). Examples for run 42 of 1a2b3c4d:
          #   commit after v3.8.1  -> 3.8.2-trial.run42.g1a2b3c4d.<height>   (MinVer adds the height)
          #   commit tagged v3.8.1 -> 3.8.1-trial.run42.g1a2b3c4d             (override, MinVer would say 3.8.1)
          # The 'g' keeps the hash a valid SemVer identifier even when it is all digits.
          $marker = "trial.run$env:GITHUB_RUN_NUMBER.g$(git rev-parse --short=8 HEAD)"
          $tag = git tag --points-at HEAD --list 'v*' | Select-Object -First 1
          if ($tag) {
            $line = "MinVerVersionOverride=$($tag.Substring(1))-$marker"
          } else {
            $line = "MinVerDefaultPreReleaseIdentifiers=$marker"
          }
          Write-Host "Trial build: $line"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value $line

      - name: Run build.ps1
        id: build # build.ps1 sets the 'version' output
        run: ./build.ps1

      - name: Keep trial build
        if: env.TRIAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oled-protect-${{ steps.build.outputs.version }}
          # Every deliverable starts with OledProtect-; the publish\ staging folder does not match.
          path: artifacts/OledProtect-*
          if-no-files-found: error

      - name: Draft GitHub release
        if: env.FROM_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          $v = $env:VERSION
          $intro = @"
          ## 💾 Welke download? / Which download?

          | Bestand | Grootte | Installeren? | Instellingen staan in |
          |---|---|---|---|
          | **``OledProtect-$v-Setup.exe``** | ~3 MB | Ja, installeert zo nodig ook de .NET 8 Desktop Runtime | ``%APPDATA%\OledProtect`` |
          | **``OledProtect-$v-Portable.exe``** | ~70 MB | Nee, één bestand dat je zo start | ``Data\`` naast de exe |
          | **``OledProtect-$v-Portable-x64.zip``** | ~64 MB | Nee, uitpakken en starten | ``Data\`` naast de exe |

          De SHA-256-sommen staan in ``OledProtect-$v-SHA256SUMS.txt``.

          **Windows SmartScreen:** de bestanden hebben geen digitale handtekening. Meldt Windows *"Windows heeft uw pc beschermd"*, klik dan op **Meer info → Toch uitvoeren**.

          ---

          "@
          $notes = Join-Path $env:RUNNER_TEMP 'release-intro.md'
          Set-Content -LiteralPath $notes -Value $intro -Encoding utf8

          # --generate-notes asks GitHub for the changelog of merged pull requests (grouped by label, see
          # .github/release.yml) and puts it below the intro above.
          $assets = @(Get-ChildItem -LiteralPath artifacts -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --draft --title "OLED Protect $env:GITHUB_REF_NAME" --notes-file $notes --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed.' }
