name: Release

# Pushing a v* tag (on master) builds everything and opens a draft release to review and publish.
# A manual run is a trial: the files are only stored as a workflow artifact, nothing is released.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Trial build (manual runs never create a release)'
        type: boolean
        default: true

jobs:
  ship:
    name: Build and draft
    runs-on: windows-latest
    permissions:
      contents: write # needed by gh release create
    defaults:
      run:
        shell: pwsh
    env:
      TAGGED: ${{ startsWith(github.ref, 'refs/tags/') }}
      MANUAL: ${{ github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout with tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer needs the tags to compute the version

      - name: Tag must be on master
        if: env.TAGGED == 'true'
        run: |
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/master
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::$env:GITHUB_REF_NAME does not point into master. Tag a commit on master (after merging develop)."
            exit 1
          }
          Write-Host "OK: $env:GITHUB_REF_NAME is part of master."

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Add commit to trial version
        if: env.MANUAL == 'true'
        run: |
          # MinVer reads MinVerBuildMetadata from the environment, so a trial build gets a +<sha>
          # suffix and is easy to tell apart from a tagged release.
          $sha = git rev-parse --short HEAD
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MinVerBuildMetadata=$sha"

      - name: Run build.ps1
        id: build # build.ps1 sets the 'version' output
        run: ./build.ps1

      - name: Keep trial build
        if: env.MANUAL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: oled-protect-${{ steps.build.outputs.version }}
          path: |
            artifacts/*
            !artifacts/publish
          if-no-files-found: error

      - name: Draft GitHub release
        if: env.TAGGED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          $v = $env:VERSION
          $intro = @"
          ## 💾 Welke download? / Which download?

          | Bestand | Grootte | Installeren? | Instellingen staan in |
          |---|---|---|---|
          | **``OledProtect-$v-Setup.exe``** | ~3 MB | Ja, installeert zo nodig ook de .NET 8 Desktop Runtime | ``%APPDATA%\OledProtect`` |
          | **``OledProtect-$v-Portable.exe``** | ~70 MB | Nee, één bestand dat je zo start | ``Data\`` naast de exe |
          | **``OledProtect-$v-Portable-x64.zip``** | ~64 MB | Nee, uitpakken en starten | ``Data\`` naast de exe |

          De SHA-256-sommen staan in ``OledProtect-$v-SHA256SUMS.txt``.

          **Windows SmartScreen:** de bestanden hebben geen digitale handtekening. Meldt Windows *"Windows heeft uw pc beschermd"*, klik dan op **Meer info → Toch uitvoeren**.

          ---

          "@

          # Changelog from the merged pull requests, grouped by label (see .github/release.yml).
          # gh returns it as separate lines, so glue them back together for the Markdown.
          $log = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:GITHUB_REF_NAME" --jq .body
          if ($LASTEXITCODE -ne 0) { throw 'gh could not generate the release notes.' }
          Set-Content -LiteralPath release-notes.md -Value ($intro + ($log -join "`n")) -Encoding utf8

          $assets = @(Get-ChildItem -LiteralPath artifacts -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --draft --title "OLED Protect $env:GITHUB_REF_NAME" --notes-file release-notes.md
