name: Release

# A v* tag on master produces a draft GitHub release. Starting the workflow by hand only builds the
# files and attaches them to the run, so the installer can be tried without releasing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test build only (a manual run never publishes a release)'
        type: boolean
        default: true

jobs:
  package:
    name: Package and draft release
    runs-on: windows-latest
    permissions:
      contents: write # gh release create
    defaults:
      run:
        shell: pwsh
    env:
      # Empty until code signing is arranged (.claude/docs/code-signing.md); the signing step then stays off.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # MinVer reads the version from the tags

      - name: Refuse tags that are not on master
        if: env.IS_TAG == 'true'
        run: |
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/master
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Tag $env:GITHUB_REF_NAME points at a master commit."
            exit 0
          }
          Write-Host "::error::Tag $env:GITHUB_REF_NAME is not on master. Merge develop into master first and tag the merge."
          exit 1

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Label manual builds with their commit
        if: github.event_name == 'workflow_dispatch'
        run: |
          # MinVer picks this property up from the environment: an untagged test build then carries
          # +<sha> in its version and cannot pass for a real release.
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "MinVerBuildMetadata=$(git rev-parse --short HEAD)"

      - name: Build installer, portable builds and checksums
        id: build # build.ps1 writes 'version' to GITHUB_OUTPUT
        run: ./build.ps1

      # Placeholder until the SignPath Foundation application is approved and the secret exists.
      - name: Sign
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          Write-Host '::error::SIGNPATH_API_TOKEN is set but signing is not wired up yet (.claude/docs/code-signing.md).'
          exit 1

      - name: Attach test build to the run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: oled-sleeper-${{ steps.build.outputs.version }}
          path: |
            artifacts/*
            !artifacts/publish
          if-no-files-found: error

      - name: Create draft release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          $v = $env:VERSION
          $downloads = @"
          ## 💾 Welke download? / Which download?

          | Bestand | Grootte | Installeren? | Instellingen staan in |
          |---|---|---|---|
          | **``OLED-Space-Sleeper-$v-Setup.exe``** | ~3 MB | Ja (haalt zo nodig de .NET 8 Desktop Runtime op) | ``%APPDATA%\OLED-Space-Sleeper`` |
          | **``OLED-Space-Sleeper-$v-Portable.exe``** | ~70 MB | Nee — één bestand, dubbelklikken en klaar | ``Data\`` naast de exe |
          | **``OLED-Space-Sleeper-$v-Portable-x64.zip``** | ~64 MB | Nee — uitpakken en starten | ``Data\`` naast de exe |

          Controleer een download met ``OLED-Space-Sleeper-$v-SHA256SUMS.txt``.

          **Windows SmartScreen:** de bestanden zijn niet digitaal ondertekend. Zie je *"Windows heeft uw pc beschermd"*, kies dan **Meer info → Toch uitvoeren**.

          ---

          "@

          # GitHub groups the merged pull requests by label (.github/release.yml); the table goes on top.
          # gh prints the body line by line; join it again so the Markdown keeps its line breaks.
          $changes = (gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=$env:GITHUB_REF_NAME" --jq .body) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Generating the release notes failed.' }
          Set-Content -LiteralPath release-notes.md -Value ($downloads + $changes) -Encoding utf8

          $files = Get-ChildItem -LiteralPath artifacts -File | Select-Object -ExpandProperty FullName
          gh release create $env:GITHUB_REF_NAME @files --draft --title "OLED Space Sleeper $env:GITHUB_REF_NAME" --notes-file release-notes.md
